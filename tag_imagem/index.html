<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag de Imagem</title>
</head>
<body>
    <h1>Tag de Imagem</h1>

    <!-- img - Imagem
    src - Source (origem, fonte) 
    alt - alternative-->
    
    <figure>
    <img src="../imagens/praia.jpg" alt="imagem de praia"
    width="500" title="Imagem de praia vista do alto"/>


<figcaption>Imagem de Praia</figcaption>
</figure>


</body>
</html>
